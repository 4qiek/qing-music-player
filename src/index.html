<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清 · 音乐播放器</title>
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/weather.css">
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>

<!-- SVG 图标定义（内联 symbol，避免加载额外字体/图标库） -->
<svg style="display:none">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm14.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 17.5 12z"/><path d="M20.2 4.8 19.1 5.9a7.5 7.5 0 0 1 0 12.2l1.1 1.1a9 9 0 0 0 0-14.4z"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-tape" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="7.5" cy="12" r="2"/><circle cx="16.5" cy="12" r="2"/><path d="M9.5 12h5"/></symbol>
</svg>

<!-- ===== 顶部栏 ===== -->
<div class="topbar">
  <img src="../assets/qing-logo.png" alt="清" style="width:32px;height:32px;object-fit:contain;margin-right:8px;flex-shrink:0;">
  <div class="search-box">
    <svg class="s-icon"><use href="#i-search"/></svg>
    <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." aria-label="搜索歌曲或歌手">
  </div>
  <div class="platform-tabs" id="platformTabs">
    <div class="platform-tab active" data-platform="netease" role="button" tabindex="0">网易云</div>
    <div class="platform-tab" data-platform="qq" role="button" tabindex="0">QQ音乐</div>
    <div class="platform-tab" data-platform="kugou" role="button" tabindex="0">酷狗</div>
  </div>
  <div class="top-right">
    <div class="weather-widget" id="weatherWidget" title="单击查看天气动画 · 双击切换城市" role="button" tabindex="0" aria-label="查看天气">
      <span class="w-temp" id="wTemp">--°</span>
      <div>
        <div class="w-city" id="wCity">扬州</div>
        <div class="w-desc" id="wDesc">加载中...</div>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深浅色主题">
      <svg><use id="themeIcon" href="#i-moon"/></svg>
    </button>
  </div>
</div>

<!-- ===== 主体 ===== -->
<div class="main">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="nav-section">资料库</div>
    <div class="nav-item active" data-view="local" role="button" tabindex="0">
      <svg><use href="#i-home"/></svg> 本地音乐
    </div>
    <div class="nav-item" data-view="search" role="button" tabindex="0">
      <svg><use href="#i-search"/></svg> 在线搜索
    </div>
    <div class="nav-section" id="playlistSection" style="display:none;">我的歌单</div>
    <div id="playlistNav"></div>

    <div class="city-poem" id="cityPoem" title="根据当前城市随机展示相关诗句，点击「换」可换一句">
      <div class="cp-head">
        <span class="cp-city" id="cpCity">扬州</span>
        <span class="cp-shuffle" id="cpShuffle" role="button" tabindex="0" aria-label="换一句诗句">换</span>
      </div>
      <div class="cp-text" id="cpText"></div>
      <div class="cp-from" id="cpFrom"></div>
    </div>

    <div class="user-card" id="userCard">
      <button class="login-btn" id="loginBtn">登录网易云账号</button>
    </div>
  </div>

  <!-- 两栏工作区 -->
  <div class="workspace">
    <!-- 左栏：封面 + 播放控制 + 歌词 -->
    <section class="panel-left" aria-label="播放面板">
      <div class="main-cover-wrap">
        <img class="main-cover" id="mainCoverImg" src="" alt="专辑封面" loading="lazy" style="display:none;">
        <div class="vinyl paused" id="mainVinyl" style="display:block;"></div>
      </div>
      <div class="main-song-info">
        <div class="main-song-name" id="mainSongName">未播放</div>
        <div class="main-song-artist" id="mainSongArtist">选择一首歌曲开始</div>
      </div>
      <div class="main-controls">
        <button class="ctrl-btn" id="prevBtn" title="上一曲 (P)" aria-label="上一曲"><svg><use href="#i-prev"/></svg></button>
        <button class="ctrl-btn play-btn" id="playBtn" title="播放/暂停 (空格)" aria-label="播放或暂停"><svg><use href="#i-play"/></svg></button>
        <button class="ctrl-btn" id="nextBtn" title="下一曲 (N)" aria-label="下一曲"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="progress-wrap">
        <span class="time-label" id="mainCurTime">00:00</span>
        <input type="range" class="progress" id="mainProgress" min="0" max="100" value="0" aria-label="播放进度">
        <div class="progress-tip" id="progressTip"></div>
        <span class="time-label" id="mainTotTime">00:00</span>
      </div>
      <div class="main-sub-controls">
        <div class="volume-wrap">
          <button class="mute-btn" id="muteBtn" title="静音 (M)" aria-label="切换静音"><svg><use id="volumeIcon" href="#i-volume"/></svg></button>
          <input type="range" class="volume" id="volume" min="0" max="100" value="80" aria-label="音量 (↑↓)">
        </div>
        <div class="quality-select">
          <button class="quality-btn" id="qualityBtn" aria-label="选择音质">标准 <span style="font-size:8px">▼</span></button>
          <div class="quality-menu" id="qualityMenu">
            <div class="q-item active" data-level="standard">标准</div>
            <div class="q-item" data-level="higher">较高</div>
            <div class="q-item" data-level="exhigh">极高</div>
            <div class="q-item" data-level="lossless">无损</div>
          </div>
        </div>
        <button class="icon-btn" id="eqToggle" title="均衡器" aria-label="打开均衡器"><svg><use href="#i-eq"/></svg></button>
        <button class="icon-btn" id="tapeToggle" title="磁带模式" aria-label="切换磁带音效"><svg><use href="#i-tape"/></svg></button>
      </div>
      <div class="tape-indicator" id="tapeIndicatorMain"></div>
      <div class="lyric-panel">
        <div class="pd-lyric" id="lyricPanel">
          <div class="lyric-line empty">暂无歌词</div>
        </div>
      </div>
    </section>

    <!-- 右栏：内容 + EQ -->
    <section class="panel-right">
      <div class="content" id="content">
        <div id="view-local">
          <div class="content-header">
            <div>
              <h2>本地音乐</h2>
              <div class="sub">导入本地音频文件，支持 MP3 / FLAC / WAV / OGG 等格式</div>
            </div>
            <button class="btn btn-primary" id="importBtn">+ 导入音乐</button>
            <input type="file" id="fileInput" accept="audio/*" multiple style="display:none;">
          </div>
          <div class="song-list" id="localList">
            <div class="empty-state">
              <div class="big-icon"><svg style="width:48px;height:48px"><use href="#i-music"/></svg></div>
              <p>还没有导入音乐</p>
              <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择本地文件</button>
            </div>
          </div>
        </div>
        <div id="view-search" style="display:none;">
          <div class="content-header">
            <div><h2>在线搜索</h2><div class="sub" id="searchSub">在顶部搜索框输入关键词开始搜索</div></div>
          </div>
          <div class="song-list" id="searchList">
            <div class="empty-state">
              <div class="big-icon"><svg style="width:48px;height:48px"><use href="#i-search"/></svg></div>
              <p>搜索你喜欢的音乐</p>
            </div>
          </div>
        </div>
        <div id="view-playlist" style="display:none;">
          <div class="content-header">
            <div><h2 id="playlistTitle">歌单</h2><div class="sub" id="playlistSub"></div></div>
          </div>
          <div class="song-list" id="playlistList"></div>
        </div>
      </div>

      <!-- EQ 面板（右侧抽屉） -->
      <div class="eq-panel" id="eqPanel" role="dialog" aria-label="均衡器">
        <div class="eq-header">
          <span>十段均衡器</span>
          <span class="eq-reset" id="eqReset" role="button" tabindex="0">重置</span>
        </div>
        <div class="eq-bands" id="eqBands"></div>
        <div class="eq-presets">
          <select id="eqPresets" aria-label="EQ 预设">
            <option value="flat">平直</option>
            <option value="pop">流行</option>
            <option value="rock">摇滚</option>
            <option value="jazz">爵士</option>
            <option value="classical">古典</option>
            <option value="vocal">人声</option>
            <option value="bass">重低音</option>
            <option value="treble">高音增强</option>
          </select>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- ===== 底部迷你播放条 ===== -->
<div class="player-bar">
  <div class="now-playing" id="npExpand" title="展开播放页（Space 播放/暂停，↑↓ 音量，←→ 快进快退，N/P 切歌）" role="button" tabindex="0">
    <div class="np-cover" id="npCover">
      <img id="npCoverImg" src="" alt="" style="display:none;">
      <div class="vinyl paused" id="npVinyl" style="width:44px;height:44px;"></div>
    </div>
    <div class="np-info">
      <div class="np-title" id="npTitle">未播放</div>
      <div class="np-artist" id="npArtist">选择一首歌曲开始</div>
    </div>
    <div class="tape-indicator" id="tapeIndicatorBar"></div>
  </div>
  <div class="player-center">
    <div class="np-controls">
      <button class="ctrl-btn" id="npPlayBtn" title="播放/暂停" aria-label="播放或暂停"><svg><use href="#i-play"/></svg></button>
      <button class="ctrl-btn" id="npNextBtn" title="下一曲" aria-label="下一曲"><svg><use href="#i-next"/></svg></button>
    </div>
    <div class="np-progress-wrap">
      <span class="time-label" id="npCurTime">00:00</span>
      <input type="range" class="progress np-progress" id="npProgress" min="0" max="100" value="0" aria-label="播放进度">
      <span class="time-label" id="npTotTime">00:00</span>
    </div>
  </div>
  <div class="player-right">
    <button class="icon-btn" id="expandBtn" title="展开播放页" aria-label="展开播放页"><svg><use href="#i-expand"/></svg></button>
  </div>
</div>

<!-- ===== 播放详情浮层 ===== -->
<div class="player-detail" id="playerDetail">
  <div class="pd-header">
    <div class="pd-title">正在播放</div>
    <button class="pd-close" id="pdClose" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="pd-body">
    <div class="pd-cover-wrap">
      <div style="width:340px;height:340px;position:relative;">
        <img class="pd-cover" id="pdCoverImg" src="" alt="" loading="lazy" style="display:none;">
        <div class="vinyl rotate paused" id="pdVinyl" style="width:340px;height:340px;"></div>
      </div>
      <div class="pd-song-info">
        <div class="pd-song-name" id="pdSongName">--</div>
        <div class="pd-song-artist" id="pdSongArtist">--</div>
      </div>
    </div>
  </div>
  <div class="pd-controls">
    <div class="pd-progress-wrap">
      <span class="time-label" id="pdCurTime">00:00</span>
      <input type="range" class="progress" id="pdProgress" min="0" max="100" value="0" style="max-width:600px" aria-label="播放进度">
      <span class="time-label" id="pdTotTime">00:00</span>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="pdPrevBtn" aria-label="上一曲"><svg><use href="#i-prev"/></svg></button>
      <button class="ctrl-btn play-btn" id="pdPlayBtn" aria-label="播放或暂停"><svg><use href="#i-play"/></svg></button>
      <button class="ctrl-btn" id="pdNextBtn" aria-label="下一曲"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<!-- ===== 天气动画页面 ===== -->
<div class="weather-page" id="weatherPage">
  <div class="wp-header">
    <div class="wp-city" id="wpCity">扬州</div>
    <button class="wp-close" id="wpClose" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="wp-body">
    <div class="wp-landmarks" id="wpLandmarks"></div>
    <div class="wp-province-label" id="wpProvinceLabel"></div>
    <div class="wp-scene" id="wpScene"></div>
    <div class="wp-temp" id="wpTemp">--°</div>
    <div class="wp-desc" id="wpDesc">--</div>
    <div class="wp-range" id="wpRange">--</div>
  </div>
</div>

<!-- ===== 登录弹窗 ===== -->
<div class="modal-overlay" id="loginModal">
  <div class="modal" role="dialog" aria-label="登录网易云音乐">
    <h3>登录网易云音乐</h3>
    <div class="modal-sub">登录后可同步你的歌单与收藏</div>
    <div class="form-group"><label for="loginPhone">手机号</label><input type="text" id="loginPhone" placeholder="请输入手机号"></div>
    <div class="form-group"><label for="loginPass">密码</label><input type="password" id="loginPass" placeholder="请输入密码"></div>
    <div class="error-msg" id="loginError" role="alert"></div>
    <div class="modal-actions">
      <button class="btn" id="loginCancel">取消</button>
      <button class="btn btn-primary" id="loginSubmit">登录</button>
    </div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous" preload="metadata"></audio>

<script type="module" src="./js/app.js"></script>
</body>
</html>
